[project]
name = "vestagraph-generator"
version = "0.0.0"
description = "Reads the fixtures, calls the cost engine and writes costs.json and area-result.json (decision 0039)."
requires-python = ">=3.14"
dependencies = ["vestagraph-engine", "vestagraph-area"]

[tool.uv.sources]
vestagraph-engine = { workspace = true }
vestagraph-area = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
