[project]
name = "vestagraph-area"
version = "0.0.0"
description = "Reads the area data and works out the area-result figures (At a glance counts, distances, buses per hour, priority results) and the council figures (council tax by band, rent or buy, captions, tenure shares, budget check, place search)."
requires-python = ">=3.14"
dependencies = ["vestagraph-engine"]

[tool.uv.sources]
vestagraph-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
