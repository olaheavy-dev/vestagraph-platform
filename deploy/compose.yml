# Placeholder service for the hosting foundation (stage 5b group A).
# Replace <CADDY_NETWORK> and <SECRETS_DIR> on the server. The server copy lives in the private infrastructure repository.
services:
  placeholder:
    image: ghcr.io/olaheavy-dev/vestagraph-placeholder-live:production
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Small caps so one misbehaving service cannot starve the shared server.
    mem_limit: 128m
    pids_limit: 64
    labels:
      - "com.centurylinklabs.watchtower.scope=vestagraph"
    networks:
      - caddy
    secrets:
      - secret_check
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy:
    name: <CADDY_NETWORK>
    external: true

secrets:
  secret_check:
    file: <SECRETS_DIR>/secret_check
