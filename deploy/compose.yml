# The pilot API service (#93). It replaced the placeholder service of stage 5b group A.
# Replace <CADDY_NETWORK> on the server. The server copy lives in the private infrastructure repository.
services:
  api:
    image: ghcr.io/olaheavy-dev/vestagraph-api-live:production
    # VESTAGRAPH_COMMIT comes from the image. The area check stays closed (AREA_CHECK_OPEN is not set)
    # until the founder opens it with the Privacy notice (decision 0014).
    environment:
      APP_ENV: production
      LOG_JSON: "true"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Small caps so one misbehaving service cannot starve the shared server.
    mem_limit: 128m
    pids_limit: 64
    labels:
      # The server's Watchtower updates only containers marked enable=true, within its own scope.
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=vestagraph"
    networks:
      - caddy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy:
    name: <CADDY_NETWORK>
    external: true
