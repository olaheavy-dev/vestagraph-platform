name: Images

# Builds the API image (`deploy/api.Dockerfile`) and, after the founder approves the `production`
# environment, builds it again from the approved commit and writes it as the live image
# (`vestagraph-api-live`) that the server's Watchtower pulls (stage 5b group A; the API since #93).
#   pull_request:      build only (nothing is pushed), when an image or release path changes
#   push to main:      build, then release (waits for approval), when an image or release path changes
#   workflow_dispatch: release only, from main, for a re-release or a rollback: it rebuilds the earlier commit
# Runs only when something that goes into the image or the release changes (founder, 22 Nov 2026:
# "run release only when the app or deploy/ changes"), so a documentation-only merge no longer queues a
# release for approval. A re-release or rollback is still the manual run below.
on:
  pull_request:
    paths: &image-paths
      - "pyproject.toml"
      - "packages/vestagraph-api/**"
      - "packages/vestagraph-area/**"
      - "packages/vestagraph-engine/**"
      - "packages/fixtures/data/**"
      - "packages/fixtures/schema/**"
      - "uv.lock"
      - "deploy/**"
      - ".dockerignore"
      - "tools/release_check.py"
      - "tools/launch_guard.py"
      - "tools/launch_placeholders.json"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    paths: *image-paths
  workflow_dispatch:
    inputs:
      commit:
        description: "Full commit SHA (40 hex characters) on main that is built and becomes production"
        required: true
        type: string

# One package, written only by the approved release with the production environment's own token, so no
# other branch can move it (plan, founder's choices of 22 Nov 2026). No job here has `packages: write`.
permissions: {}

env:
  LIVE_IMAGE: ghcr.io/olaheavy-dev/vestagraph-api-live

jobs:
  build:
    name: build
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: this job pushes nothing.
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        env:
          COMMIT: ${{ github.sha }}
        run: docker build -f deploy/api.Dockerfile --build-arg "VESTAGRAPH_COMMIT=${COMMIT}" -t "vestagraph-api:build" .

  wrong-branch:
    name: manual run must use main
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No permissions: this job only fails.
    permissions: {}
    steps:
      - name: Fail so the run does not look successful
        run: |
          echo "A manual release must run from the main branch. Nothing was released." >&2
          exit 1

  release:
    name: release
    needs: build
    # On a push this waits for build. On a manual run build is skipped, so release runs alone (main only).
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The founder approves this environment before the job starts.
    environment: production
    # A newer release waits in the queue and replaces an older waiting one (which shows as cancelled).
    # Two quick pushes can queue an older commit last (it replaces the newer waiting one): check the commit on the approval screen before approving.
    concurrency:
      group: release-production
      cancel-in-progress: false
    # Read-only on the repository. The live image is written with the environment's own token, not GITHUB_TOKEN.
    permissions:
      contents: read
    env:
      COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - name: Check the commit is a full SHA
        run: |
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "The commit must be 40 lowercase hex characters." >&2
            exit 1
          fi

      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keep the main branch's own copies of the release check and the launch guard with its list: the
      # commit being released may be an old one, and a rollback to a commit with draft text must also stop.
      - name: Keep this run's release check and launch guard
        run: cp tools/release_check.py tools/launch_guard.py tools/launch_placeholders.json "$RUNNER_TEMP/"

      - name: Check the commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "Commit $COMMIT is not on main. Nothing was released." >&2
            exit 1
          fi
          git checkout --detach "$COMMIT"

      - name: Check the release token is set
        env:
          RELEASE_TOKEN: ${{ secrets.GHCR_RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "The production environment has no secret GHCR_RELEASE_TOKEN. Nothing was released." >&2
            exit 1
          fi

      - name: Build the image from the approved commit
        run: docker build -f deploy/api.Dockerfile --build-arg "VESTAGRAPH_COMMIT=${COMMIT}" -t "${LIVE_IMAGE}:sha-${COMMIT}" -t "${LIVE_IMAGE}:production" .

      # Launch guard (OP-06; design docs/superpowers/specs/2026-11-26-launch-guard-design.md): run the new
      # image on the runner and fail, before anything is pushed, while its pages hold draft text such as
      # "To be written before launch (SE-02)", or while a page cannot be read.
      - name: Check the new image's pages for draft text (launch guard, OP-06)
        run: |
          # Clean up however the step ends, including a failed docker run.
          trap 'docker rm -f launch-guard > /dev/null 2>&1 || true' EXIT
          # The same limits as deploy/compose.yml, where they apply on the runner.
          docker run -d --name launch-guard --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 128m --pids-limit 64 \
            -p 127.0.0.1:8080:8080 \
            -e APP_ENV=production \
            "${LIVE_IMAGE}:sha-${COMMIT}"
          status=0
          python3 "$RUNNER_TEMP/launch_guard.py" --base-url http://127.0.0.1:8080 \
            --strings "$RUNNER_TEMP/launch_placeholders.json" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "The container's own output:" >&2
            # Stop GitHub reading workflow commands (::error:: and so on) from the image's output.
            stop_token="$(openssl rand -hex 16)"
            echo "::stop-commands::${stop_token}"
            docker logs launch-guard >&2 || true
            echo "::${stop_token}::"
          fi
          exit "$status"

      - name: Log in to GHCR with the release token
        env:
          RELEASE_TOKEN: ${{ secrets.GHCR_RELEASE_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$RELEASE_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push the live image
        id: push
        run: |
          docker push "${LIVE_IMAGE}:sha-${COMMIT}"
          docker push "${LIVE_IMAGE}:production"
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${LIVE_IMAGE}:sha-${COMMIT}")
          echo "pushed digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check the production tag has the pushed digest
        env:
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          live_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${LIVE_IMAGE}:production")
          echo "pushed: $PUSHED_DIGEST"
          echo "live:   $live_digest"
          if [ -z "$PUSHED_DIGEST" ] || [ "$PUSHED_DIGEST" != "$live_digest" ]; then
            echo "The production tag does not hold the pushed image." >&2
            exit 1
          fi

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

      - name: Wait for the live health page to report the commit
        run: python3 "$RUNNER_TEMP/release_check.py" --url https://vestagraph.com/healthz --commit "$COMMIT"
